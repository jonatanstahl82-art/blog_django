{% extends 'posts/base.html' %}

{% block content %}
<h2>Confirmar Eliminación de Usuario</h2>

<div style="background-color: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-bottom: 20px; max-width: 500px;">
    <p>¿Estás seguro de que querés eliminar permanentemente al usuario <strong>{{ usuario_borrar.username }}</strong>?</p>
    <p style="font-size: 13px; color: #856404;"><em>Atención: Esto eliminará su perfil y todos los datos asociados.</em></p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" style="background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">
        Sí, eliminar usuario
    </button>
    <a href="{% url 'lista_usuarios' %}" style="margin-left: 15px; text-decoration: none; color: #6c757d;">Cancelar</a>
</form>

{% endblock %}
